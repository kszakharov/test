name: Create GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:

  build:
    uses: ./.github/workflows/build.yml@main


  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      TZ: America/Toronto
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: rada_${{ env.VERSION }}.tar.gz
          path: dist
      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          sed -n "/^## \[${{ steps.vars.outputs.version }}\]/,/^## \[/p"  CHANGELOG.md | sed '1d; :a; /^[[:space:]]*$/ {N; ba}; $ { /^[[:space:]]*$/d }' > RELEASE_NOTES.md

          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Generate checksum
        run: |
          sha256sum dist/rada_${{ env.VERSION }}.tar.gz | awk '{print $1}' > dist/rada_${{ env.VERSION }}_checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.release_notes }}
          files: dist/*
          generate_release_notes: false
